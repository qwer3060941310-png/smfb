CampaignStoryBeginDesertStormfrontV01CleanETC = Desert areas have often been a land of conflict. Various motives brought war, but most of all they has been a target for its resources. The most abundant of all, oil, is highly sought after. The blood of modern societies and with it, nations would crumble.\n\nIt's the dawn of war. The desert people have started to defy demands of the water people, halting oil exports to several countries. Desperate to gain power, the desert nations have began work on building a weapons arsenal ready to strike anywhere and any time. Actions had to be taken.\n\nWith war on their mind, the water nations have banded together to devise a plan with the goal to capture major cities, oil fields and military structures. Once key locations were secured, the coalition would negotiate with the governments and relinquish the land back to the people. But they would find that the desert nations would not give in so easily...\n

# com.operationstormfront.core.config.SubConfigDSF
CampaignStoryBeginDesertStormfrontV01ETC = The Middle East has often been a land of conflict. Various motives brought war to the region, but in more recent years the Middle East has been a target for its resources. The most abundant of all, oil, is highly sought after. The blood of modern societies and with it, nations would crumble.\n\nIt's the dawn of war. Iran has started to defy demands of the Western World, halting oil exports to several countries. Desperate to gain power, the nation has began work on building a nuclear arsenal. Several bombings in the USA and France have been directly linked to the Iranian government. Actions had to be taken.\n\nWith war on their mind, USA and France have banded together to devise a plan with the goal to capture major cities, oil fields and military structures in Iran including surrounding regions. Once key locations were secured, the Western coalition would negotiate with the governments and relinquish the land back to the people. But they would find that the Middle Eastern nations would not give in so easily...\n

# com.operationstormfront.core.config.SubConfigTSF
CampaignStoryBeginTropicalStormfrontCleanV01ETC = Anger, hate, greed, revenge, it was inevitable. But it was not until now that it became so clear who was fighting who, and what for. One nation poised on domination, began to attack lesser countries. An imperialistic war machine imposing their power and beliefs. The world cried for help, and there were some who rose to the call.\n\nThe centerpiece of the war, a large body of water cluttered with islands was the only thing between the powers involved in the war. It became clear that whichever side could hold the sea would have the upper hand.\n\nThe sides were drawn, the stage set. The war would now truly begin and no one knew how it would end. Take command in an epic power struggle and push back the tide of war so that the world may see peace once again.\n

# com.operationstormfront.core.config.SubConfigTSF
CampaignStoryBeginTropicalStormfrontV01ETC = Anger, hate, greed, revenge, it was inevitable. But it was not until now that it became so clear who was fighting who, and what for. China, the red nation poised on domination, began to attack lesser third world countries. The imperialistic war machine imposing their power and beliefs. The world cried for help, and there were some who rose to the call. The United States of America, Russia, and England all began to openly work against China under the name United Democratic Alliance, or UDA for short. While strong, the Chinese government sought allies. Japan and Germany shared many of their views and began to aid them, first supplies, then with military action. Together they formed the alliance of Order, Discipline, and Obedience, or ODO.\n\nThe centerpiece of the war quickly became the Pacific. The large body of water cluttered with islands was the only thing between USA and China, the two powerhouses in the war. While warfare was waged elsewhere, it became clear that whichever side could hold the Pacific would have the upper hand. With Russia's main focus on their border with China, UDA needed more allies. Brazil rallied to their side after a great deal of persuasion. On the other side of the world, India became an ally to China, for fear that if they did not, they would be consumed by them.\n\nThe sides were drawn, the stage set. The war would now truly begin and no one knew how it would end. Will ODO win and demand the world change to their imperialistic ways? Would the UDA be able to stop them and drive them back to their homelands? Lead the UDA on an exciting campaign as you try to push back the tide of war, so that the world may see peace once again.\n

