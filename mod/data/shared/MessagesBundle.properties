Tutorial08DesertStormfrontETC = Let's build a Humvee, so we take over the oil field. Please note the Humvee is the only unit that can take over structures.\n\nTask\: Click on your base station and select the blue button to build a Humvee.

# com.operationstormfront.core.config.SubConfigTSF
Tutorial08TropicalStormfrontETC = Excellent\! You can close the base station panel by clicking on the [x] button.\n\nTask\: Close the panel for the base station.

# com.operationstormfront.core.config.SubConfigTSF
Tutorial09BTropicalStormfrontETC = While we wait for the tank to be build, let's practice how to change the view. You can change the visible part of the map with your pointer.\n\nTask\: Press ASDW on the keyboard or move your mouse to the edges of the screen. Mouse and keyboard settings can be adjusted in the [Options] screen.

