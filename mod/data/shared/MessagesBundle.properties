# com.operationstormfront.core.screen.ManualScreen
InformationAIETC = The AI is very good at micromanaging the various units. The AI's weakness is planning and coordinating large-scale attacks amonst various unit groups as well as using terrain features to its advantage. The AI is not programmed to cheat, but will get more resource if difficulty "Hard" or "Extreme" is selected. The resources are reduced for "Easy" difficulty. If you choose "Normal", it's all fair game\!

# com.operationstormfront.core.screen.ManualScreen
InformationControlsETC = Controls (Mouse and Touch)\:\n - Key ESC\: pause game\n - Key A/S/D/F\: scroll screen\n - Key 1-8\: select squad\n - Key SHIFT 1-8\: set as squad squad\n - Key CTRL 1-8\: add to squad squad\n - Key Z\: stop unit\n - Key X\: repair unit\n - Key C\: unit patrol\n - Key Q\: group units\n - Key E\: un-group units\n - Key SPACEBAR\: deselect\n - Mouse LEFT\: select\n - Mouse RIGHT (units)\: move/attack\n - Mouse RIGHT (structure)\: rally point\n - Mouse RIGHT + SHIFT\: unload all\n - Mouse LEFT double-click\: select same\n - Mouse (SHIFT) LEFT drag\: box select\n - Mouse CTRL LEFT drag\: add to selection\n - Touch\: (1) select (2) move/attack\n - Touch double-click\: stop unit\n - Touch drag (after squad sel.)\: grouping\n\nPlease note, keys and mouse settings can be changed in the [Options] screen. Select mouse "RTS Mode" for best experience on Desktop. Disable "RTS Mode" for touch screen devices.

# com.operationstormfront.core.screen.ManualScreen
InformationFunctionsETC = GUI Functions (i.e. buttons)\:\n - MOVE\: move/attack\n - PATROL\: patrol between 2 points\n - REPAIR\: repair & come back\n - STOP\: stops a unit\n - GROUP\: group units\n - AUTO\: single unit auto-attack/patrol\n - mini MOVE\: unload all units\n - mini AUTO\: all units auto-attack/patrol\n - mini RALLY\: rally point for structures\n - mini SPLIT\: ungroup units\n - Squad [1]-[8] click\: select/create squad\n - Squad [1]-[8] double-click\: center screen\n - Unit HUD [x]\: close unit HUD\n

# com.operationstormfront.core.screen.ManualScreen
InformationHostingETC = Mobile units that are hosted within a structure or one of the transport units are repaired (and refueled) automatically. Air units that are set to auto-navigate conduct reconnaissance and attack enemy units within range on their own.Please note each mobile unit displays 4 mini strength bars on the input panel that represent the unit's strengths and weeknesses against (a) ground (b) air (c) sea and (d) submergible enemies.

