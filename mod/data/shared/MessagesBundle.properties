# com.operationstormfront.core.screen.ManualScreen
InformationMultiplayerETC = If playing multiplayer games using WiFi or cable is recommended. Using 3G or the like is possible if your provider supports streaming data. If your provider does not support streaming data, it will run incredibly delayed. Please also try during off peak hours (very very late night) if your only option is to play via 2G or 3G. If you play over a LAN, your game should run at about the same responsiveness as playing single player. If you are in a local network (LAN), and you would like to host games over the internet, make sure you enable port forwarding for port {0} to your computer (port adjustable in [Options] screen). The game also tries to open the port via UPnP for you automatically, but depending on your router it might fail. Please be aware that port forwarding might not be possible in a company or academic network, so your only option is to join rather than host games. The game will notify you if a hosted game is only playable via LAN. If you don't receive such a message and host a game, you can safely assume that the game is playable over the internet. For questions and problems, please refer to the forums.

# com.operationstormfront.core.config.SubConfigDSF
InformationUnitsDesertStormfrontETC = The game features 17 mobile units as well as 4 land structures. Structures enable you to build new units. The oil field generates a fixed income every {0} seconds. The only unit that can be used to take over structures is the Humvee.

# com.operationstormfront.core.config.SubConfigTSF
InformationUnitsTropicalStormfrontETC = The game features 12 mobile units as well as 3 land structures. Structures enable you to build new units and generate a fixed income every {0} seconds. The only unit that can be used to take over structures is the battle tank.

# com.operationstormfront.core.screen.ManualScreen
InformationXPPointsETC = Experience Points (XP) are recorded for each unit and are gained by eliminating enemy troops. Destroying {0} hostiles will move the unit up to 1-Star level. Destroying {1} hostiles to 2-Star and {2} to 3-Star level. Each XP level gives both a 25% offense and defense bonus.

