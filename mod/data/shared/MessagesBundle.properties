AppDescriptionDesertStormfrontCleanETC = Desert Stormfront is a Real-Time Strategy (RTS) game situated in the desert. You play on hot desert landscapes for power and oil. Units at your disposal include Humvees, Tanks, Artillery, Mechanics, Helicopters, Planes, Ships and Submarines amongst others. Desert Stormfront supports multiplayer games over LAN and internet including co-op multiplayer.\n\nThe game features 30 pre-defined campaign missions where you take command and fight battles in the desert for control of major cities, oil fields and military structures.\n\nDesert Stormfront contains a random map generator in addition to the 30 campaign missions. Scenarios include eliminating enemy forces, capturing the flag, defending against incoming troops, convoy missions, sea and air battles as well as tank fights. The game keeps track of high scores and playing statistics.

