# com.operationstormfront.core.config.SubConfigDSF
MiscNotesDesertStormfrontETC = IMPORTANT\: Please note that the game requires a screen resolution of 800x480 pixels or higher. Although the game still runs on a lower resolution, not all GUI elements will be rendered properly. The game has been thoroughly tested and runs at about 30+ frames/seconds. It is possible though that the application is slow on some devices. Please try the LITE version before purchase to verify proper function. If you encounter any problems running the game, try (1) a device restart (i.e. turn off completely) as well as (2) a complete re-install.\n\nThe LITE version of the game includes 4 campaign mission to allow you to evaluate the game. There is no time limit and the game does not contain any spyware, malware or third party software of such kind. Again, please try the LITE version first to verify the application works on your device. If you are having any problems or are not happy with your purchase, feel free to contact us via email at any time. For a full refund please include your order\# with your message.\n\nAlso try our other strategy game Tropical Stormfront if you like to play the game in a more tropical environment \:)\n\nThank you & Enjoy the Game\!\nnoblemaster\n\nTwitter\: http\://twitter.com/noblemaster

