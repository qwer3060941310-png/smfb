# com.operationstormfront.core.config.SubConfigTSF
Tutorial07TropicalStormfrontETC = Let's build a battle tank, so we can attack the enemy. Please note the battle tank is the only unit that can take over structures.\n\nTask\: (1) Click on your base station and (2) select the blue button to build a tank.

