# com.operationstormfront.core.config.SubConfigTSF
Tutorial21TropicalStormfrontETC = Other unit actions available are [Patrol] which makes a unit patrol between two positions. [Repair] will make a unit go repair itself and return back to it's original location thereafter. A double-click will [Stop] a unit. Air units can be set to [Auto] mode which will make them to move on their own.

# com.operationstormfront.core.config.SubConfigDSF
