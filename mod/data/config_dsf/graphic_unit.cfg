OSF Unit V1
 
# A block of unit tiles starts with the following line (requires exactly 8 "unit-item:" for each direction!):
# unit: <name> <fx> <fy> <ax> <ay>
#   <name> = reference name for the unit in code (do not change!)
#   <fx> = the x-offset of all the non-animated "unit-item" coordinates (can be negative)
#   <fy> = the y-offset of all the non-animated "unit-item" coordinates (can be negative)
#   <ax> = the x-offset of all the animated "unit-item" coordinates (can be negative)
#   <ay> = the y-offset of all the animated "unit-item" coordinates (can be negative)
# Each "unit:" block requires exactly 8 "unit-item:" for each direction:
#   1st "unit-item:"   ->   90� (not used for structures, write "none")
#   2nd "unit-item:"   ->  135�
#   3rd "unit-item:"   ->  180� (not used for structures, write "none")
#   4th "unit-item:"   ->  225�
#   5th "unit-item:"   ->  270� (not used for structures, write "none")
#   6th "unit-item:"   ->  325�
#   7th "unit-item:"   ->    0� (not used for structures, write "none")
#   8th "unit-item:"   ->   45�
#
# A) Non-animated unit tile (e.g. for fighter plane): 
# unit-item: <hx> <hy> | <cx> <cy> <tx> <ty> <tw> <th> S
#   <hx> = relative x-offset for unit HUD
#   <hy> = relative y-offset for unit HUD
#   <cx> = relative x-offset for the center
#   <cy> = relative y-offset for the center
#   <tx> = x-position of frame on texture sheet 
#   <ty> = y-position of frame on texture sheet
#   <tw> = frame width on texture sheet
#   <th> = frame height on texture sheet
#   S = indicator for "static"
# 
# B) Movement-animated unit tile (animates when moving, e.g. for tank):
# unit-item: <hx> <hy> | <cx> <cy> <tx> <ty> <tw> <th> D<distance> : <cx> <cy> <tx> <ty> <tw> <th> D<distance> : ...
#   D<distance> = how far a unit travels until frame changes (e.g. D0.05) -> tile length is 1.00
#   : = divider for animation frames
#    
# C) Movement-animated unit tile (animates when moving + 1 frame for standing still, e.g. for ships)
# unit-item: <hx> <hy> | <cx> <cy> <tx> <ty> <tw> <th> S : <cx> <cy> <tx> <ty> <tw> <th> D<distance> : <cx> <cy> <tx> <ty> <tw> <th> D<distance> : ...
#   Note: "S" is the frame used when the unit is standing still, the rest is used for the movement animation.
#
# D) Time-animated unit tile (always animates, even when unit is still, e.g. for helicopter)
# unit-item: <hx> <hy> | <cx> <cy> <tx> <ty> <tw> <th> T<time> : <cx> <cy> <tx> <ty> <tw> <th> T<time> : ...
#   T<time> = how long the frame shall be displayed in milliseconds
#
# Except for D), each unit can have an optional animation (e.g. airfield radar, submarine bubbles). Add the following to the end:
# ... | <cx> <cy> <tx> <ty> <tw> <th> T<time> : <cx> <cy> <tx> <ty> <tw> <th> T<time> : ...
#
# IMPORTANT: coordinates on texture need to be a multiple of 16, i.e. 0, 16, 32, 48, 64, 80, 96 ... (offsets/other variables flexible!)

